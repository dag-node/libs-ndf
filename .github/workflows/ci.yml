name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for SourceLink / deterministic builds

      # 8.0 is the oldest runtime the console app targets; 10.0 builds its other target
      # framework and the test projects.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Locked mode fails where packages.lock.json and the project graph disagree, so a
      # dependency change reaches CI as a lock file change rather than a silent upgrade.
      - run: dotnet restore --locked-mode

      - run: dotnet build --no-restore -c Release

      # Unit tests carry no platform requirement and run wherever the job runs.
      - name: Test (unit)
        run: dotnet test tests/DagNode.NDF.Interoperability.Core.UnitTests --no-build -c Release

      # Integration and boundary tests drive a real bash. On a runner without one they would
      # report inconclusive — green while covering nothing — so the job asserts the platform
      # instead of relying on the skip.
      - name: Test (integration and boundary)
        if: runner.os == 'Linux'
        run: |
          dotnet test tests/DagNode.NDF.Interoperability.Core.IntegrationTests --no-build -c Release
          dotnet test tests/DagNode.NDF.Interoperability.Core.BoundaryTests --no-build -c Release

      - name: Pack (validates packable projects)
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
