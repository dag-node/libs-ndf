name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read
  id-token: write   # required for NuGet.org Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget   # must match the NuGet Trusted Publishing policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for SourceLink / deterministic builds

      # 8.0 is the oldest runtime the console app targets; 10.0 builds its other target
      # framework and the test projects.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Locked mode fails where packages.lock.json and the project graph disagree, so a
      # release resolves the exact dependency graph the lock files record.
      - run: dotnet restore --locked-mode

      - run: dotnet build --no-restore -c Release

      - name: Test (unit)
        run: dotnet test tests/DagNode.NDF.Interoperability.Core.UnitTests --no-build -c Release

      # The bash-dependent categories report inconclusive without a real bash, so the release
      # asserts the platform rather than publishing on a run that covered nothing.
      - name: Test (integration and boundary)
        if: runner.os == 'Linux'
        run: |
          dotnet test tests/DagNode.NDF.Interoperability.Core.IntegrationTests --no-build -c Release
          dotnet test tests/DagNode.NDF.Interoperability.Core.BoundaryTests --no-build -c Release

      - name: Pack all packable projects
        run: dotnet pack --no-build -c Release -o artifacts

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key. No stored secret. `user` is the NuGet.org account that
      # owns the policy (set repo variable NUGET_USER).
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Package versions come from each .csproj <Version>; --skip-duplicate makes
      # re-runs safe and lets each package release independently.
      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
