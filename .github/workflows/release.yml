name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget   # gate on a protected environment holding NUGET_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SourceLink / deterministic builds

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - name: Pack all packable projects
        run: dotnet pack --no-build -c Release -o artifacts

      # Package versions come from each .csproj <Version>; --skip-duplicate makes
      # re-runs safe and lets each package release independently.
      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
